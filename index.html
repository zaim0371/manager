<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zaim’s Manager</title>
<style>
/* token warna: abu-abu bening, terang & gelap ikut sistem */
:root{
  --ink:#17191d; --muted:rgba(23,25,29,.58);
  --card:rgba(255,255,255,.62); --card2:rgba(255,255,255,.36); --edge:rgba(255,255,255,.85); --inner:rgba(255,255,255,.7);
  --bar:rgba(244,245,247,.66); --sheet:rgba(247,248,250,.94); --shadow:rgba(40,44,52,.14); --field:rgba(255,255,255,.7);
  --in:#0f9d68; --out:#e5484d; --accent:#0a7cff;
  --base1:#eceef1; --base2:#d6d9de; --hl:rgba(255,255,255,.75); --hl2:rgba(255,255,255,.4);
  --spring:cubic-bezier(.34,1.4,.5,1); --smooth:cubic-bezier(.2,.9,.25,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#f4f6f9; --muted:rgba(244,246,249,.68);
    --card:rgba(255,255,255,.14); --card2:rgba(255,255,255,.06); --edge:rgba(255,255,255,.22); --inner:rgba(255,255,255,.2);
    --bar:rgba(58,61,68,.72); --sheet:rgba(50,53,60,.94); --shadow:rgba(0,0,0,.38); --field:rgba(255,255,255,.11);
    --in:#3fe0a0; --out:#ff7b86; --accent:#4da3ff;
    --base1:#30343a; --base2:#17191d; --hl:rgba(255,255,255,.1); --hl2:rgba(255,255,255,.04);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  color:var(--ink);min-height:100vh;line-height:1.45;background:var(--base2);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
/* latar statis (tanpa animasi supaya ringan) */
.bg{
  position:fixed;inset:0;z-index:-1;transform:translateZ(0);
  background:radial-gradient(70% 45% at 12% 0%,var(--hl),transparent 70%),radial-gradient(60% 40% at 100% 100%,var(--hl2),transparent 70%),linear-gradient(180deg,var(--base1),var(--base2));
}

/* kartu kaca: tanpa blur agar scroll & animasi mulus */
.glass{
  position:relative;border-radius:28px;border:1px solid var(--edge);
  background:linear-gradient(150deg,var(--card),var(--card2));
  box-shadow:inset 0 1px 0 var(--inner),0 10px 28px var(--shadow);
}
/* blur hanya untuk elemen melayang di atas konten */
.blur{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);background:var(--bar)}

main{max-width:560px;margin:0 auto;padding:14px 16px calc(130px + env(safe-area-inset-bottom,0px))}
.top{padding:14px 6px 20px}
.top h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.top p{color:var(--muted);margin-top:4px}
.page{display:none}.page.active{display:block}
.card{padding:20px;margin-bottom:14px}
h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:.88rem}
.in{color:var(--in)}.out{color:var(--out)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* animasi masuk halaman (hanya transform & opacity) */
.rise{animation:rise .55s var(--smooth) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* widget uang saat ini */
.wallet{padding:26px 22px 22px;margin-bottom:14px;border-radius:36px;overflow:hidden}
.orb{
  position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.3) 30%,rgba(140,148,160,.28) 68%,rgba(140,148,160,.06));
  box-shadow:inset -8px -10px 22px rgba(120,128,142,.28),inset 6px 8px 16px rgba(255,255,255,.7);
}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--field);font-size:.8rem;font-weight:600;color:var(--muted)}
.total{font-size:clamp(2.3rem,12vw,3.5rem);font-weight:800;letter-spacing:-.04em;line-height:1.08;margin:2px 0 22px;word-break:break-word;font-variant-numeric:tabular-nums}
.total.neg{color:var(--out)}
.track{position:relative;height:12px;border-radius:99px;overflow:hidden;background:rgba(127,127,127,.22)}
.track i{position:absolute;top:0;bottom:0;width:100%;transform:scaleX(0);transition:transform .9s var(--smooth)}
.track .a{left:0;transform-origin:left;background:var(--in)}
.track .b{right:0;transform-origin:right;background:var(--out)}
.legend{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.legend b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mini .card{margin:0;padding:18px}
.mini .v{font-size:1.15rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
input,select{
  font:inherit;font-size:1rem;color:var(--ink);width:100%;height:50px;padding:0 16px;border-radius:18px;
  background:var(--field);border:1px solid var(--edge);box-shadow:inset 0 1px 3px rgba(0,0,0,.07);
  -webkit-appearance:none;appearance:none;transition:box-shadow .25s;
}
input::placeholder{color:var(--muted)}
input:focus,select:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
input[type=date]{display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* segmented control, thumb meluncur */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:99px;background:var(--field);box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--out);transition:transform .5s var(--spring),background-color .3s}
.seg.is-in .thumb{transform:translateX(100%);background:var(--in)}
.seg button{position:relative;border:0;background:transparent;font:inherit;font-weight:700;padding:12px;border-radius:99px;color:var(--muted);cursor:pointer;transition:color .25s}
.seg button.on{color:#fff}

.btn{
  border:1px solid var(--edge);border-radius:99px;padding:13px 22px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;
  background:linear-gradient(150deg,var(--card),var(--card2));box-shadow:inset 0 1px 0 var(--inner),0 6px 16px var(--shadow);
  transition:transform .3s var(--spring);
}
.btn:active{transform:scale(.94)}
.btn.pri{color:#fff;border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.sm{padding:8px 16px;font-size:.9rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* anggaran & kategori */
.bar{height:10px;background:rgba(127,127,127,.22);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--smooth)}
.bar i.over{background:var(--out)}
.cat{margin-top:12px}

/* riwayat */
.filters{display:flex;gap:6px;margin:12px 0 4px}
.chip{border:0;background:var(--field);color:var(--muted);padding:8px 18px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;transition:background-color .25s,color .25s,transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ink);color:var(--base1)}
ul{list-style:none;padding:0}
li.tx{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;max-height:96px;overflow:hidden;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);
  transition:max-height .35s var(--smooth),opacity .25s,transform .35s var(--smooth),padding .35s var(--smooth);
}
li.tx:last-child{border-bottom:0}
li.tx.leave{max-height:0;opacity:0;transform:translateX(36px);padding-top:0;padding-bottom:0}
li.tx.new{animation:pop .55s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(-12px)}}
.tx .l{min-width:0}
.tx .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .r{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:50%;font-size:1rem;transition:transform .3s var(--spring)}
.del:active{transform:scale(.8)}
.empty{text-align:center;color:var(--muted);padding:22px 0}

/* tab bar bawah, lensa kaca meluncur */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100% - 32px));padding:6px;display:grid;grid-template-columns:repeat(3,1fr);border-radius:99px;
}
.lens{
  position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:99px;
  background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--inner),0 4px 12px var(--shadow);
  transition:transform .5s var(--spring);will-change:transform;
}
.tab{
  position:relative;z-index:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:99px;transition:color .25s;
}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--spring)}
.tab.on{color:var(--accent)}
.tab.on svg{transform:scale(1.1)}
.tab:active svg{transform:scale(.88)}

/* nominal besar, pilihan kategori, handle sheet */
.amt{position:relative}
.amt span{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.1rem;color:var(--muted)}
.amt input{height:66px;padding-left:56px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;border-radius:22px}
.lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks .chip{padding:10px 18px}
.grab{width:42px;height:5px;border-radius:99px;background:var(--muted);opacity:.35;margin:-8px auto 16px}
.sheet .fgrid{gap:14px}

/* jadwal: galeri */
[hidden]{display:none!important}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;margin-top:14px;aspect-ratio:16/10;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;background:var(--field);overflow:hidden}
.slide.add{border:2px dashed var(--edge);font:inherit;font-weight:600;color:var(--muted);display:grid;place-items:center;align-content:center;gap:8px;cursor:pointer}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.pdf{position:absolute;inset:0;display:grid;place-items:center;background:var(--field)}
.pdf canvas{width:100%;height:100%;object-fit:contain;background:#fff}
.pdfic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--out)}
.nm{position:absolute;left:0;right:0;top:0;padding:10px 56px 22px 14px;color:#fff;font-size:.82rem;font-weight:600;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:.95rem;transition:transform .3s var(--spring)}
.x:active{transform:scale(.85)}
.go{position:absolute;left:12px;bottom:12px;padding:8px 16px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;text-decoration:none}
.drop{width:100%;aspect-ratio:16/10;margin-top:14px;border:2px dashed var(--edge);border-radius:22px;background:var(--field);color:var(--muted);display:grid;place-items:center;align-content:center;gap:8px;font:inherit;font-weight:600;cursor:pointer;transition:transform .3s var(--spring)}
.drop:active{transform:scale(.98)}
.dots{display:flex;justify-content:center;gap:7px;margin-top:12px;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;transition:transform .35s var(--spring),opacity .25s,background-color .25s}
.dots i.on{opacity:1;transform:scale(1.5);background:var(--accent)}

/* jadwal mingguan */
.day{background:var(--field);border:1px solid var(--edge);border-radius:22px;padding:14px;margin-top:12px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.day h3{font-size:1rem;font-weight:700}
.day .pill{background:var(--accent);color:#fff}
.items{margin-top:10px}
.items li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--card);margin-bottom:6px;word-break:break-word}
.items li.new{animation:pop .5s var(--spring)}
.items li.none{background:transparent;color:var(--muted);font-size:.88rem;padding:2px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{height:46px;border-radius:99px;padding:0 18px}
.addrow button{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.4rem;cursor:pointer;transition:transform .3s var(--spring)}
.addrow button:active{transform:scale(.85)}

/* tombol plus */
.fab{
  position:fixed;right:max(20px,calc((100vw - 560px)/2 + 16px));bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:25;
  width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.55);cursor:pointer;color:#fff;display:grid;place-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .4s var(--spring);animation:fabin .6s var(--spring) .3s backwards;
}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
@keyframes fabin{from{transform:scale(0)}}

/* lembar catat & toast */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(10,12,16,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet .glass{background:var(--sheet);width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .55s var(--spring)}
.sheet.show .glass{transform:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:40;padding:12px 22px;border-radius:99px;font-weight:700;white-space:nowrap;transform:translate(-50%,-140%);transition:transform .55s var(--spring)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:430px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="toast glass blur" id="toast" role="status"></div>

<main>
  <header class="top">
    <h1>Zaim’s Manager</h1>
  </header>

  <!-- BERANDA -->
  <section id="beranda" class="page active">
    <div class="wallet glass rise">
      <div class="orb"></div>
      <span class="pill" id="w-month">Bulan ini</span>
      <div class="muted" style="margin-top:14px">Uang saat ini</div>
      <div class="total" id="w-total">Rp0</div>
      <div class="track" aria-hidden="true"><i class="a" id="w-a"></i><i class="b" id="w-b"></i></div>
      <div class="legend">
        <span class="muted">Pemasukan<b class="in" id="w-in">Rp0</b></span>
        <span class="muted" style="text-align:right">Pengeluaran<b class="out" id="w-out">Rp0</b></span>
      </div>
    </div>
  </section>

  <!-- KEUANGAN -->
  <section id="keuangan" class="page">
    <div class="mini">
      <div class="card glass rise"><div class="muted">Masuk bulan ini</div><div class="v in" id="m-in">Rp0</div></div>
      <div class="card glass rise"><div class="muted">Keluar bulan ini</div><div class="v out" id="m-out">Rp0</div></div>
    </div>

    <div class="card glass rise">
      <h2>Pengeluaran per kategori</h2>
      <div id="cats"></div>
    </div>

    <div class="card glass rise">
      <div class="row"><h2>Riwayat</h2><button class="btn sm" id="csv" type="button">Ekspor CSV</button></div>
      <div class="filters" id="filters">
        <button class="chip on" type="button" data-f="all">Semua</button>
        <button class="chip" type="button" data-f="in">Masuk</button>
        <button class="chip" type="button" data-f="out">Keluar</button>
      </div>
      <ul id="list"></ul>
    </div>

    <!-- tombol plus kanan bawah -->
    <button class="fab" id="fab" type="button" aria-label="Catat transaksi">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- JADWAL -->
  <section id="jadwal" class="page">
    <div class="card glass rise">
      <h2>Galeri</h2>
      <button class="drop" id="drop" type="button">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Tambah PDF, gambar, atau video
      </button>
      <div class="car" id="car" hidden></div>
      <div class="dots" id="dots"></div>
      <input type="file" id="mfile" hidden multiple accept="image/*,video/*,application/pdf">
    </div>

    <div class="card glass rise">
      <h2>Jadwal mingguan</h2>
      <div id="week"></div>
    </div>
  </section>
</main>

<!-- lembar catat transaksi (dibuka tombol plus) -->
<div class="sheet" id="sheet">
  <div class="glass blur">
    <div class="grab"></div>
    <div class="row" style="margin-bottom:16px"><h2>Catat transaksi</h2><button class="btn sm" id="x" type="button">Tutup</button></div>
    <div class="fgrid" style="margin-top:0">
      <div class="seg full" id="seg" role="group" aria-label="Jenis transaksi">
        <span class="thumb"></span>
        <button type="button" data-t="out" class="on">Pengeluaran</button>
        <button type="button" data-t="in">Pemasukan</button>
      </div>
      <label class="full">Jumlah<div class="amt"><span>Rp</span><input id="f-amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div></label>
      <div class="full"><div class="lbl">Kategori</div><div class="picks" id="f-cat"></div></div>
      <label>Catatan<input id="f-note" type="text" maxlength="60" placeholder="Opsional"></label>
      <label>Tanggal<input id="f-date" type="date"></label>
      <button class="btn pri full" id="save" type="button">Simpan transaksi</button>
    </div>
  </div>
</div>

<!-- tab bar bawah -->
<nav class="tabbar glass blur" aria-label="Menu utama">
  <span class="lens" id="lens"></span>
  <button class="tab on" type="button" data-page="beranda" data-i="0">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda
  </button>
  <button class="tab" type="button" data-page="keuangan" data-i="1">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3.5"/><path d="M3 10.5h18M16 15h2"/><path d="m6 6 9-3 1 3"/></svg>Keuangan
  </button>
  <button class="tab" type="button" data-page="jadwal" data-i="2">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Jadwal
  </button>
</nav>

<script>
/* ---------- data ---------- */
const CATS = { out:["Makan","Transport","Belanja","Tagihan","Hiburan","Lainnya"], in:["Gaji","Bonus","Hadiah","Lainnya"] };
let state = { tx:[], sched:[[],[],[],[],[],[],[]] };
let kind = "out", cat = "", flt = "all", lastId = null;

// penyimpanan dibungkus try/catch; kalau diblokir, data tetap hidup di memori
function load(){ try{ const s = JSON.parse(localStorage.getItem("zaims-manager-v1")); if(s && s.tx) state = s; }catch(e){} delete state.tables; if (!Array.isArray(state.sched) || state.sched.length !== 7) state.sched = [[],[],[],[],[],[],[]]; }
function save(){ try{ localStorage.setItem("zaims-manager-v1", JSON.stringify(state)); }catch(e){} }

const $ = id => document.getElementById(id);
const rp = n => (n < 0 ? "-" : "") + "Rp" + Math.abs(Math.round(n)).toLocaleString("id-ID");
const sum = (a, t) => a.filter(x => x.type === t).reduce((s, x) => s + x.amt, 0);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const inMonth = x => x.date.slice(0, 7) === today().slice(0, 7);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* angka saldo berjalan (satu elemen saja agar ringan) */
function tween(el, to){
  const from = el._v ?? 0; el._v = to;
  cancelAnimationFrame(el._r);
  if (still || from === to){ el.textContent = rp(to); return; }
  const t0 = performance.now();
  const step = t => {
    const p = Math.min((t - t0) / 700, 1), e = 1 - Math.pow(1 - p, 4);
    el.textContent = rp(from + (to - from) * e);
    if (p < 1) el._r = requestAnimationFrame(step);
  };
  el._r = requestAnimationFrame(step);
}
// bar tumbuh lewat transform (tidak memicu layout)
function grow(el, ratio){ el.style.transform = "scaleX(0)"; void el.offsetWidth; el.style.transform = "scaleX(" + ratio + ")"; }

let tt;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1900);
}
function buzz(){ try{ navigator.vibrate && navigator.vibrate(10); }catch(e){} }

/* ---------- navigasi ---------- */
function go(p, i){
  document.querySelectorAll(".page").forEach(s => s.classList.toggle("active", s.id === p));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.page === p));
  $("lens").style.transform = "translateX(" + (i * 100) + "%)";
  $(p).querySelectorAll(".rise").forEach((el, n) => {
    el.style.setProperty("--i", n); el.classList.remove("rise"); void el.offsetWidth; el.classList.add("rise");
  });
  if (p === "keuangan") renderCats();
  window.scrollTo(0, 0);
  if (p === "jadwal") last = Date.now();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { buzz(); go(t.dataset.page, +t.dataset.i); }));

/* ---------- render ---------- */
function renderHome(){
  const inc = sum(state.tx, "in"), out = sum(state.tx, "out"), bal = inc - out, tot = inc + out;
  tween($("w-total"), bal); $("w-total").classList.toggle("neg", bal < 0);
  $("w-in").textContent = rp(inc); $("w-out").textContent = rp(out);
  $("w-a").style.transform = "scaleX(" + (tot ? inc / tot : 0) + ")";
  $("w-b").style.transform = "scaleX(" + (tot ? out / tot : 0) + ")";
  const m = state.tx.filter(inMonth);
  $("m-in").textContent = rp(sum(m, "in")); $("m-out").textContent = rp(sum(m, "out"));
  $("w-month").textContent = new Date().toLocaleDateString("id-ID", { month:"long", year:"numeric" });
}

function renderCats(){
  const by = {};
  state.tx.filter(x => x.type === "out" && inMonth(x)).forEach(x => by[x.cat] = (by[x.cat] || 0) + x.amt);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), box = $("cats");
  box.innerHTML = "";
  if (!rows.length){ box.innerHTML = '<div class="empty">Belum ada pengeluaran bulan ini.</div>'; return; }
  rows.forEach(([c, v]) => {
    const d = document.createElement("div"); d.className = "cat";
    const r = document.createElement("div"); r.className = "row";
    const a = document.createElement("span"); a.textContent = c;
    const b = document.createElement("b"); b.textContent = rp(v);
    r.append(a, b);
    const bar = document.createElement("div"); bar.className = "bar";
    const i = document.createElement("i"); bar.appendChild(i);
    d.append(r, bar); box.appendChild(d); grow(i, v / rows[0][1]);
  });
}

function renderList(){
  const ul = $("list"); ul.innerHTML = "";
  const rows = state.tx.filter(x => flt === "all" || x.type === flt).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  if (!rows.length){ ul.innerHTML = '<li class="empty">Belum ada transaksi. Tekan tombol + untuk mencatat.</li>'; return; }
  rows.forEach(x => {
    const li = document.createElement("li"); li.className = "tx" + (x.id === lastId ? " new" : "");
    const l = document.createElement("div"); l.className = "l";
    const b = document.createElement("b"); b.textContent = x.note || x.cat;
    const s = document.createElement("span"); s.className = "muted";
    s.textContent = x.cat + ", " + new Date(x.date + "T00:00").toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
    l.append(b, s);
    const r = document.createElement("div"); r.className = "r " + x.type;
    const amt = document.createElement("span"); amt.textContent = (x.type === "in" ? "+" : "-") + rp(x.amt);
    const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "✕";
    del.setAttribute("aria-label", "Hapus transaksi");
    del.addEventListener("click", () => {
      buzz(); li.classList.add("leave");
      setTimeout(() => { state.tx = state.tx.filter(t => t.id !== x.id); save(); renderAll(); toast("Transaksi dihapus"); }, 360);
    });
    r.append(amt, del); li.append(l, r); ul.appendChild(li);
  });
  lastId = null;
}
function renderAll(){ renderHome(); renderCats(); renderList(); }

/* ---------- input ---------- */
// format ribuan otomatis saat mengetik
function money(el){ el.addEventListener("input", () => { const d = el.value.replace(/\D/g, ""); el.value = d ? Number(d).toLocaleString("id-ID") : ""; }); }
const num = el => Number(el.value.replace(/\D/g, "")) || 0;
money($("f-amt"));

function fillCats(){
  cat = CATS[kind][0];
  const box = $("f-cat"); box.innerHTML = "";
  CATS[kind].forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (c === cat ? " on" : ""); b.textContent = c;
    b.addEventListener("click", () => { cat = c; box.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); buzz(); });
    box.appendChild(b);
  });
}
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => {
  kind = b.dataset.t;
  $("seg").classList.toggle("is-in", kind === "in");
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  fillCats(); buzz();
}));

/* simpan transaksi (tanpa <form> supaya tidak diblokir sandbox) */
function saveTx(){
  const amt = num($("f-amt"));
  if (!amt){
    const f = $("f-amt"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); f.focus();
    toast("Isi jumlah dulu"); return;
  }
  const id = Date.now();
  state.tx.push({ id, type:kind, amt, cat, note:$("f-note").value.trim(), date:$("f-date").value || today() });
  lastId = id; save(); buzz();
  $("f-amt").value = ""; $("f-note").value = "";
  closeSheet(); renderAll(); toast(kind === "in" ? "Pemasukan disimpan" : "Pengeluaran disimpan");
}
$("save").addEventListener("click", saveTx);
["f-amt", "f-note"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") saveTx(); }));

$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  flt = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});

/* lembar catat transaksi */
const sheet = $("sheet");
function openSheet(){ sheet.classList.add("show"); setTimeout(() => $("f-amt").focus(), 350); }
function closeSheet(){ sheet.classList.remove("show"); }
$("fab").addEventListener("click", () => { buzz(); openSheet(); });
$("x").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ekspor CSV */
$("csv").addEventListener("click", () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ["tanggal,jenis,kategori,catatan,jumlah"].concat(state.tx.map(x => [x.date, x.type === "in" ? "masuk" : "keluar", q(x.cat), q(x.note), x.amt].join(",")));
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type:"text/csv" }));
    a.download = "keuangan.csv"; document.body.appendChild(a); a.click(); a.remove();
    toast("CSV diekspor");
  }catch(e){ toast("Ekspor tidak didukung di sini"); }
});

/* ---------- JADWAL: galeri (file disimpan di IndexedDB) ---------- */
let media = [], db = null, last = 0, pdfLib = null, raf2;
const kindOf = f => /^image\//.test(f.type) ? "image" : /^video\//.test(f.type) ? "video" : (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) ? "pdf" : null;
function openDb(){ return new Promise(ok => { try{ const r = indexedDB.open("zaims-media", 1); r.onupgradeneeded = () => r.result.createObjectStore("m", { keyPath:"id" }); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }catch(e){ ok(null); } }); }
const store = mode => db.transaction("m", mode).objectStore("m");
function dbPut(m){ try{ db && store("readwrite").put({ id:m.id, name:m.name, kind:m.kind, blob:m.blob }); }catch(e){} }
function dbDel(id){ try{ db && store("readwrite").delete(id); }catch(e){} }
async function initMedia(){
  db = await openDb();
  if (db) await new Promise(ok => { try{ const q = store("readonly").getAll(); q.onsuccess = () => { media = q.result.sort((a, b) => a.id - b.id).map(m => ({ ...m, url:URL.createObjectURL(m.blob) })); ok(); }; q.onerror = ok; }catch(e){ ok(); } });
  renderMedia();
}

// pratinjau PDF halaman pertama lewat pdf.js (butuh internet); kalau gagal, tampil ikon PDF
function loadPdf(){
  return pdfLib || (pdfLib = new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfLib = null; no(); };
    document.head.appendChild(sc);
  }));
}
async function renderPdf(m, box, nm){
  try{
    if (!m.canvas){
      const lib = await loadPdf();
      const doc = await lib.getDocument({ data: await m.blob.arrayBuffer() }).promise;
      const pg = await doc.getPage(1), vp = pg.getViewport({ scale:1.6 });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
      m.canvas = c; m.pages = doc.numPages;
    }
    box.replaceChildren(m.canvas); nm.textContent = m.name + " · " + m.pages + " halaman";
  }catch(e){}
}

function renderMedia(){
  const car = $("car"), dots = $("dots");
  car.innerHTML = ""; dots.innerHTML = "";
  $("drop").hidden = media.length > 0; car.hidden = media.length === 0;
  media.forEach(m => {
    const s = document.createElement("div"); s.className = "slide";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = m.name;
    if (m.kind === "image"){ const im = new Image(); im.src = m.url; im.alt = m.name; im.draggable = false; s.appendChild(im); }
    else if (m.kind === "video"){ const v = document.createElement("video"); v.src = m.url; v.controls = true; v.playsInline = true; v.preload = "metadata"; s.appendChild(v); }
    else {
      const b = document.createElement("div"); b.className = "pdf"; b.innerHTML = '<div class="pdfic">PDF</div>'; s.appendChild(b);
      const a = document.createElement("a"); a.className = "go"; a.textContent = "Buka PDF"; a.href = m.url; a.target = "_blank"; a.rel = "noopener"; s.appendChild(a);
      renderPdf(m, b, nm);
    }
    const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Hapus file");
    x.addEventListener("click", () => { media = media.filter(k => k !== m); dbDel(m.id); URL.revokeObjectURL(m.url); renderMedia(); toast("File dihapus"); });
    s.append(nm, x); car.appendChild(s); dots.appendChild(document.createElement("i"));
  });
  if (media.length){
    const a = document.createElement("button"); a.type = "button"; a.className = "slide add";
    a.innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Tambah file';
    a.addEventListener("click", () => $("mfile").click()); car.appendChild(a);
  }
  setDots(0);
}
const idx = () => { const c = $("car"); return c.clientWidth ? Math.round(c.scrollLeft / c.clientWidth) : 0; };
function setDots(i){ [...$("dots").children].forEach((d, n) => d.classList.toggle("on", n === i)); }
function show(i){ const c = $("car"); c.scrollTo({ left:i * c.clientWidth, behavior:still ? "auto" : "smooth" }); }
$("car").addEventListener("scroll", () => { cancelAnimationFrame(raf2); raf2 = requestAnimationFrame(() => setDots(idx())); }, { passive:true });
["pointerdown", "touchstart", "wheel"].forEach(ev => $("car").addEventListener(ev, () => { last = Date.now(); }, { passive:true }));

// geser otomatis tiap 5 detik; berhenti sementara kalau video diputar atau baru disentuh
setInterval(() => {
  if (media.length < 2 || document.hidden || !$("jadwal").classList.contains("active")) return;
  if (Date.now() - last < 5000) return;
  if ([...$("car").querySelectorAll("video")].some(v => !v.paused && !v.ended)) return;
  show(idx() >= media.length - 1 ? 0 : idx() + 1);
}, 5000);

function addFiles(list){
  let n = 0;
  [...list].forEach((f, i) => {
    const kind = kindOf(f); if (!kind){ toast("Format tidak didukung"); return; }
    const m = { id:Date.now() + i, name:f.name, kind, blob:f, url:URL.createObjectURL(f) };
    media.push(m); dbPut(m); n++;
  });
  if (!n) return;
  last = Date.now(); renderMedia(); toast(n + " file ditambahkan");
  requestAnimationFrame(() => show(media.length - n));
}
$("drop").addEventListener("click", () => $("mfile").click());
$("mfile").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

/* ---------- JADWAL: mingguan Senin sampai Minggu ---------- */
const DAYS = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const todayIdx = () => (new Date().getDay() + 6) % 7;

function renderItems(d, ul, newId){
  ul.innerHTML = "";
  const items = state.sched[d];
  if (!items.length){ const li = document.createElement("li"); li.className = "none"; li.textContent = "Belum ada kegiatan"; ul.appendChild(li); return; }
  items.forEach(it => {
    const li = document.createElement("li"); if (it.id === newId) li.className = "new";
    const t = document.createElement("span"); t.textContent = it.text;
    const x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Hapus kegiatan");
    x.addEventListener("click", () => { state.sched[d] = state.sched[d].filter(k => k !== it); save(); renderItems(d, ul); buzz(); });
    li.append(t, x); ul.appendChild(li);
  });
}

function renderWeek(){
  const box = $("week"); box.innerHTML = "";
  DAYS.forEach((name, d) => {
    const day = document.createElement("div"); day.className = "day" + (d === todayIdx() ? " today" : "");
    const head = document.createElement("div"); head.className = "row";
    const h = document.createElement("h3"); h.textContent = name; head.appendChild(h);
    if (d === todayIdx()){ const pl = document.createElement("span"); pl.className = "pill"; pl.textContent = "Hari ini"; head.appendChild(pl); }
    const ul = document.createElement("ul"); ul.className = "items"; renderItems(d, ul);
    const add = document.createElement("div"); add.className = "addrow";
    const inp = document.createElement("input"); inp.type = "text"; inp.maxLength = 80; inp.placeholder = "Tulis kegiatan"; inp.setAttribute("aria-label", "Kegiatan hari " + name);
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "+"; btn.setAttribute("aria-label", "Tambah kegiatan " + name);
    const addItem = () => {
      const text = inp.value.trim();
      if (!text){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
      const it = { id:Date.now(), text }; state.sched[d].push(it); save(); inp.value = ""; renderItems(d, ul, it.id); buzz();
    };
    btn.addEventListener("click", addItem);
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addItem(); } });
    add.append(inp, btn); day.append(head, ul, add); box.appendChild(day);
  });
}

/* ---------- mulai ---------- */
load();
$("f-date").value = today();
fillCats(); renderAll(); renderWeek(); initMedia();
</script>
